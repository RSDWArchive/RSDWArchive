<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSDW Archive - RecipeData</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/shared/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/shared/assets/favicon_io/favicon-16x16.png" />
  <link rel="icon" href="/shared/assets/favicon_io/favicon.ico" />
  <link rel="manifest" href="/shared/assets/favicon_io/site.webmanifest" />
  <link rel="preload" href="https://fonts.gstatic.com/s/sofiasans/v20/Yq6T-LCVXSLy9uPBwlATrORKkzApcb8.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/shared/site-shell.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-archive-page="recipe-data" data-search-placeholder="Search recipes or item ids..." data-search-label="Search Recipe Data">
  <div id="rsdw-header-mount"></div>

<main>
    <section id="landing-message" class="landing-message">
      <p id="home-status" aria-live="polite">Loading RecipeData...</p>
      <p id="home-subtitle" class="landing-subtitle">Browse recipes - ingredients, outputs, skills, and reverse item index</p>
    </section>

    <p id="status" aria-live="polite">Loading RecipeData...</p>

    <section class="results-viewer">
      <aside>
        <div class="panel-header recipe-list-panel-header">
          <h2 id="list-title">Recipes</h2>
          <div class="recipe-list-toolbar">
            <div class="view-tabs" role="tablist" aria-label="Recipe list mode">
              <button type="button" id="tab-recipes" class="panel-action-btn view-tab-btn active" data-rsdw-view-tab="recipes" role="tab" aria-selected="true">All recipes</button>
              <button type="button" id="tab-byitem" class="panel-action-btn view-tab-btn" data-rsdw-view-tab="byitem" role="tab" aria-selected="false">By item</button>
            </div>
            <button id="toggle-filenames" type="button" class="panel-action-btn" aria-pressed="false">Show File Names</button>
          </div>
        </div>
        <ul id="results"></ul>
      </aside>
      <article>
        <div class="panel-header">
          <h2>Preview</h2>
          <div class="content-actions">
            <button id="toggle-preview-format" type="button" class="panel-action-btn" disabled>JSON</button>
            <button id="copy-preview" type="button" class="panel-action-btn preview-copy-btn" aria-label="Copy preview to clipboard" title="Copy preview to clipboard" disabled>
              <img src="/clipboard.png" alt="" />
            </button>
          </div>
        </div>
        <p id="selected-path">Select an entry</p>
        <pre id="file-content">Search and click an entry to preview compiled recipe data.</pre>
      </article>
    </section>
  </main>
<div id="copy-toast" class="copy-toast" role="status" aria-live="polite" hidden></div>

  <div id="rsdw-footer-mount"></div>

  <script src="/shared/shared-header.js" defer></script>
<script src="/search-match.js" defer></script>
  <script src="/dataset-viewer.js" defer></script>
  <script src="/wiki-recipe-template.js" defer></script>
  <script src="/recipedata.js" defer></script>
</body>
</html>
