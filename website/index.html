<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSDW Archive</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/shared/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/shared/assets/favicon_io/favicon-16x16.png" />
  <link rel="icon" href="/shared/assets/favicon_io/favicon.ico" />
  <link rel="manifest" href="/shared/assets/favicon_io/site.webmanifest" />
  <link rel="preload" href="https://fonts.gstatic.com/s/sofiasans/v20/Yq6T-LCVXSLy9uPBwlATrORKkzApcb8.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/shared/site-shell.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-archive-page="home" data-search-placeholder="Search Files..." data-search-label="Search Files">
  <div id="rsdw-header-mount"></div>

<main>
    <section id="landing-message" class="landing-message">
      <p id="home-status" aria-live="polite">Loading file index...</p>
      <p id="home-subtitle" class="landing-subtitle">Search for Anything</p>
      <p class="landing-datasets" aria-label="Compiled dataset viewers">
        <a href="/location-data/">Location</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/map/">Chunk Map</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/location-map/">Interactive Map</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/loot-data/">Loot</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/name-data/">Name</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/npc-data/">NPC</a>
        <br />
        <a href="/item-data/">Item</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/plan-data/">Plan</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/progression-data/">Progression</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/quest-data/">Quest</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/recipe-data/">Recipe</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/spell-data/">Spell</a>
        <span class="landing-datasets-sep" aria-hidden="true">&middot;</span>
        <a href="/vestige-data/">Vestige</a>
      </p>
    </section>

    <p id="status" aria-live="polite">Loading file index...</p>

    <section class="results-viewer">
      <aside>
        <div class="panel-header">
          <h2>Path</h2>
          <button id="toggle-paths" type="button">Show Paths</button>
        </div>
        <ul id="results"></ul>
      </aside>
      <article>
        <div class="panel-header">
          <h2>Content</h2>
          <div class="content-actions">
            <button id="copy-github-url" type="button" class="panel-action-btn" disabled>Github URL</button>
            <button id="copy-raw-url" type="button" class="panel-action-btn" disabled>Raw</button>
            <button id="download-file" type="button" class="panel-action-btn" disabled>Download</button>
          </div>
        </div>
        <p id="selected-path">Select a file</p>
        <pre id="file-content">Search and click a file to preview its content.</pre>
      </article>
    </section>
  </main>

  <div id="rsdw-footer-mount"></div>

  <script src="/shared/shared-header.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
