<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSDW Archive - NPCData</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/shared/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/shared/assets/favicon_io/favicon-16x16.png" />
  <link rel="icon" href="/shared/assets/favicon_io/favicon.ico" />
  <link rel="manifest" href="/shared/assets/favicon_io/site.webmanifest" />
  <link rel="preload" href="https://fonts.gstatic.com/s/sofiasans/v20/Yq6T-LCVXSLy9uPBwlATrORKkzApcb8.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/shared/site-shell.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-archive-page="npc-data" data-search-placeholder="Search NPCs..." data-search-label="Search NPC Data">
  <div id="rsdw-header-mount"></div>

<main>
    <section id="landing-message" class="landing-message">
      <p id="home-status" aria-live="polite">Loading NPCData...</p>
      <p id="home-subtitle" class="landing-subtitle">Browse NPCs, difficulty tags, and loot row mappings</p>
    </section>

    <p id="status" aria-live="polite">Loading NPCData...</p>

    <section class="results-viewer">
      <aside>
        <div class="panel-header">
          <h2 id="list-title">NPCs</h2>
          <div class="view-tabs" role="tablist" aria-label="NPC data views">
            <button id="tab-npcs" class="panel-action-btn view-tab-btn active" type="button" role="tab" aria-selected="true">NPCs</button>
            <button id="tab-difficulty" class="panel-action-btn view-tab-btn" type="button" role="tab" aria-selected="false">Difficulty</button>
            <button id="tab-loot-rows" class="panel-action-btn view-tab-btn" type="button" role="tab" aria-selected="false">Loot Rows</button>
          </div>
        </div>
        <ul id="results"></ul>
      </aside>
      <article>
        <div class="panel-header">
          <h2>Preview</h2>
          <div class="content-actions">
            <button id="toggle-preview-format" type="button" class="panel-action-btn" disabled>JSON</button>
            <button id="copy-preview" type="button" class="panel-action-btn preview-copy-btn" aria-label="Copy preview to clipboard" title="Copy preview to clipboard" disabled>
              <img src="/clipboard.png" alt="" />
            </button>
          </div>
        </div>
        <p id="selected-path">Select an entry</p>
        <pre id="file-content">Search and click an entry to preview compiled NPC data.</pre>
      </article>
    </section>
  </main>
<div id="copy-toast" class="copy-toast" role="status" aria-live="polite" hidden></div>

  <div id="rsdw-footer-mount"></div>

  <script src="/shared/shared-header.js" defer></script>
<script src="/search-match.js" defer></script>
  <script src="/npcdata.js" defer></script>
</body>
</html>
