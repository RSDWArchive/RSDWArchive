<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSDW Archive - World map</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon_io/favicon-16x16.png" />
  <link rel="icon" href="./favicon_io/favicon.ico" />
  <link rel="manifest" href="./favicon_io/site.webmanifest" />
  <link rel="preload" href="https://fonts.gstatic.com/s/sofiasans/v20/Yq6T-LCVXSLy9uPBwlATrORKkzApcb8.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="map-page">
  <header class="site-header">
    <div class="brand">
      <a class="brand-home-link logo-wrap" href="./index.html" aria-label="Go to homepage">
        <img id="site-logo" src="./logo.png" alt="RSDW Archive logo" />
      </a>
      <a class="brand-home-link brand-title" href="./index.html">RSDW Archive</a>
    </div>
    <p id="map-status" class="map-toolbar-status" role="status" aria-live="polite">Loading…</p>
    <div class="header-actions">
      <div class="discord-menu">
        <button id="discord-toggle" class="panel-action-btn discord-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Open Discord menu" title="Discord">
          <img src="./discord.png" alt="" />
        </button>
        <div id="discord-dropdown" class="tools-dropdown discord-dropdown" role="menu" hidden>
          <a href="https://discord.com/invite/rsdragonwilds" target="_blank" rel="noopener noreferrer" role="menuitem">Official</a>
          <a href="https://discord.com/invite/rsdwwiki" target="_blank" rel="noopener noreferrer" role="menuitem">Wiki</a>
          <a href="https://discord.gg/hPJfrZxPss" target="_blank" rel="noopener noreferrer" role="menuitem">Creative &amp; Sharing</a>
        </div>
      </div>
      <a class="github-link" href="https://github.com/RSDWArchive/RSDWArchive" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub repository">
        <img src="./github.svg" alt="" />
      </a>
      <div class="tools-menu">
        <button id="tools-toggle" class="panel-action-btn tools-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Open tools menu" title="Tools">
          <img src="./locationdata.png" alt="" />
        </button>
        <div id="tools-dropdown" class="tools-dropdown" role="menu" hidden>
          <a href="./LocationData.html" role="menuitem">LocationData</a>
          <a href="./Map.html" role="menuitem">Chunk Map</a>
          <a href="./LocationMap.html" role="menuitem">Interactive Map</a>
          <a href="./LocationMap.html" role="menuitem">LocationMap</a>
          <a href="./LootData.html" role="menuitem">LootData</a>
          <a href="./NameData.html" role="menuitem">NameData</a>
          <a href="./NPCData.html" role="menuitem">NPCData</a>
          <a href="./ItemData.html" role="menuitem">ItemData</a>
          <a href="./PlanData.html" role="menuitem">PlanData</a>
          <a href="./ProgressionData.html" role="menuitem">ProgressionData</a>
          <a href="./RecipeData.html" role="menuitem">RecipeData</a>
          <a href="./SpellData.html" role="menuitem">SpellData</a>
          <a href="./VestigeData.html" role="menuitem">VestigeData</a>
        </div>
      </div>
    </div>
  </header>

  <main class="map-page-main">
    <aside class="map-sidebar" aria-label="Chunk picker">
      <div class="map-sidebar-head">
        <label for="map-chunk-search" class="map-sidebar-label">Chunks</label>
        <input
          id="map-chunk-search"
          type="search"
          class="map-sidebar-search"
          placeholder="Filter e.g. &quot;maingrid -78RMVK&quot;"
          title="Space-separated tokens. Prefix a token with - to exclude. Right-click a chunk to hide it."
          autocomplete="off"
          spellcheck="false"
        />
        <p id="map-chunk-count" class="map-sidebar-count" aria-live="polite"></p>
      </div>
      <ul id="map-chunk-list" class="map-chunk-list" role="listbox" aria-label="World partition chunks"></ul>
      <div id="map-chunk-detail" class="map-chunk-detail" hidden></div>
    </aside>
    <div id="world-map" role="application" aria-label="Dragonwilds world map with selected chunk highlighted"></div>
  </main>

  <div
    id="map-context-menu"
    class="map-context-menu"
    role="menu"
    aria-label="Chunk actions"
    hidden
  >
    <div class="map-context-menu-header" id="map-context-menu-header"></div>
    <button type="button" class="map-context-menu-item" id="map-context-menu-hide" role="menuitem">
      Hide chunk
    </button>
  </div>

  <footer class="site-footer">
    <p>Game files &amp; assets are property of Jagex Ltd.</p>
    <p>
      <a href="./index.html">Archive</a>
      —
      <a href="https://rsdwbuilds.com" target="_blank" rel="noopener">Builds</a>
      —
      <a href="https://rsdwtools.com" target="_blank" rel="noopener">Tools</a>
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="./map.js" defer></script>
  <script>
    (function () {
      var btn = document.getElementById("tools-toggle");
      var menu = document.getElementById("tools-dropdown");
      if (!btn || !menu) return;
      btn.addEventListener("click", function () {
        var open = menu.hidden;
        menu.hidden = !open;
        btn.setAttribute("aria-expanded", String(open));
      });
      document.addEventListener("click", function (e) {
        if (menu.contains(e.target) || btn.contains(e.target)) return;
        menu.hidden = true;
        btn.setAttribute("aria-expanded", "false");
      });
    })();
  </script>
  <script src="./discord-menu.js" defer></script>
</body>
</html>
